<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Around Asia Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #f5f0e8;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .leaflet-popup-content {
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([5, 110], 4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const places = [

  {
    name: "Ho Chi Minh",
    coords: [10.8231, 106.6297],
    link: "vietnam/hochiminh.html"
  },

  {
    name: "Kuala Lumpur",
    coords: [3.1390, 101.6869],
    link: "malaysia/kualalumpur.html"
  },

  {
    name: "Langkawi",
    coords: [6.3500, 99.8000],
    link: "malaysia/langkawi.html"
  },

  {
    name: "Singapore",
    coords: [1.3521, 103.8198],
    link: "singapore/index.html"
  },

  {
    name: "Lombok",
    coords: [-8.6500, 116.3249],
    link: "indonesia/lombok.html"
  }

];

const route = [];

places.forEach(place => {

  L.marker(place.coords)
    .addTo(map)
    .bindPopup(`
      <b>${place.name}</b><br>
      <a href="${place.link}">Open destination</a>
    `);

  route.push(place.coords);

});

L.polyline(route, {
  color: '#3f6b5b',
  weight: 4,
  opacity: 0.8
}).addTo(map);

</script>

</body>
</html>
